# Render blueprint: deploys the Streamlit demo as a web service.
services:
  - type: web
    name: port-congestion-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OPENAI_API_KEY
        sync: false   # entered in the Render dashboard, never stored in the repo
